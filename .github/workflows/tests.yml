name: Test gateway
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q tts_api sidebar_routes.py managed_service.py __init__.py tests
      - run: node --input-type=module --check < web/tts_sidebar.js
      - run: node --test tests/test_sidebar_session.mjs
      - run: python -m pytest -q
