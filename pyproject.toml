[project]
name = "comfyui-tts-api"
version = "0.1.0"
description = "Standalone VoxCPM2 TTS gateway with ComfyUI nodes and OpenAI-style speech API"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3", "python-multipart>=0.0.9",
  "numpy>=1.26,<3", "soundfile>=0.12,<1"
]

[project.optional-dependencies]
engine = ["voxcpm"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
