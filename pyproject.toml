[project]
name = "comfyui-tts-api"
version = "0.6.0"
description = "ComfyUI-managed VoxCPM2, Qwen3-TTS and IndexTTS 2.5 speech API with native sidebar and SillyTavern compatibility"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3", "python-multipart>=0.0.9",
  "numpy>=1.26,<3", "soundfile>=0.12,<1"
]

[project.optional-dependencies]
engine = ["voxcpm"]
qwen = ["qwen-tts>=0.1.1,<1"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["tts_api*"]
exclude = ["web*", "tests*"]
